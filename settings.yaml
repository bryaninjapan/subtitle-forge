api:
  lite_model: gemini-2.5-flash
  model: gemini-2.5-flash
  pro_model: gemini-2.5-flash
asr_api:
  api_key_env: OPENROUTER_API_KEY
  model: openai/whisper-large-v3
  provider: openrouter
costs:
  flash:
  - 0.1
  - 0.4
  lite:
  - 0.04
  - 0.16
domain: CFA
openrouter:
  text_model: deepseek/deepseek-chat-v3-0324
pipeline:
  asr_aligner_model: Qwen/Qwen3-ForcedAligner-0.6B
  asr_backend: api
  asr_concurrent: 2
  asr_diarize: false
  asr_diarize_num_speakers: null
  asr_hotwords: true
  asr_model: Qwen/Qwen3-ASR-0.6B
  asr_use_draft: false
  cc_conversion: 'off'
  chapters: true
  max_cost_usd: 20.0
  post_proc_concurrent: 4
  study_notes: true
  translate: true
  use_context_caching: true
  use_qa_loop: true
  use_qa_scoring: false
  vad_threshold: 0.5
prompts:
  chapter: 'You are a {domain} academic editor. Analyze the provided transcript to
    identify logical topic shifts, specifically focusing on {domain} Learning Outcome
    Statements and major technical concepts.


    Generate a YouTube-style timestamp list (HH:MM:SS Title).


    Rules:

    - 100% strictly Simplified Chinese.

    - At least 3 chapters, maximum 10.

    - Output ONLY the list of chapters.

    '
  glossary_extraction: 'Identify 5-10 technical {domain} terms NOT in: [{existing_keys}].
    Output JSON: {{''term'': ''translation''}}.

    '
  qa_judge: 'You are a professional linguistic judge specialized in {domain} translation.

    Compare the source text and translation provided.

    Score the translation from 0 to 10 based on:

    1. Accuracy: No meaning lost or changed.

    2. Tone: Professional {domain} tone.

    3. Fluency: Natural sounding Simplified Chinese.


    Format:

    Score: [0-10]

    Critique: [Short feedback]

    '
  study_notes: 'You are an expert {domain} tutor.

    Your task is to create comprehensive, well-structured study notes in Simplified
    Chinese.


    Please integrate information from the images (slides, charts) with the transcript
    text to provide a complete picture.


    Sections to include:

    1. **课程摘要 (Summary)**: A high-level overview of the video''s content.

    2. **核心概念 (Key Concepts)**: Detailed explanations of professional terms and theories
    mentioned. Reference the slides if they contain definitions or charts.

    3. **重要公式 (Important Formulas)**: List any formulas mentioned with variable definitions.

    4. **考试重点 (Exam Focus)**: Specific tips or areas that are likely to appear on
    the {domain} exam.

    5. **中英术语对照 (Terminology Table)**: A table of technical terms used in the video.

    '
  translation: 'You are a professional {domain} subtitle translator. Translate the
    given subtitle lines from English to Simplified Chinese.


    Glossary (you MUST use these translations for these terms):

    {glossary_text}


    Strict output rules:

    - Output ONLY a valid JSON array. Nothing else.

    - Format: [{"index": <original_index>, "text": "<chinese_translation>"}, ...]

    - Every input line MUST have a corresponding output entry with the same index.

    - Translate ALL text to Chinese. Do NOT output English.

    - Preserve technical acronyms like NPV, IRR, LOS, {domain} as-is within the Chinese
    text.

    - Do NOT add explanations or preambles.

    '
  translation_qa: 'You are a {domain} quality editor. Ensure terms in {terms} are
    correct. Output JSON array with same format.

    '
test_key: test_val
